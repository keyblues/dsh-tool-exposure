name: Verify package and publish to npm

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: '12.16.1'
      - name: Install the DSH test runtime
        run: npm install --prefix "$RUNNER_TEMP/dsh-runtime" --no-save --no-package-lock --ignore-scripts @deepseek-ai/dsh@0.2.2-rc.5
      - run: npm test
        env:
          DSH_TEST_INSTALL_DIR: ${{ runner.temp }}/dsh-runtime
      - name: Verify fresh install and upgrade from the candidate archive
        env:
          DSH_TEST_INSTALL_DIR: ${{ runner.temp }}/dsh-runtime
          PACKAGE_DIR: ${{ runner.temp }}/dsh-package
        run: |
          mkdir -p "$PACKAGE_DIR"
          npm pack --ignore-scripts --pack-destination "$PACKAGE_DIR"
          node test/package-smoke.mjs "$PACKAGE_DIR"/*.tgz
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'release'
        with:
          name: verified-npm-package
          path: ${{ runner.temp }}/dsh-package/*.tgz
          if-no-files-found: error
          overwrite: true

  publish:
    if: github.event_name == 'release' && github.repository == 'keyblues/dsh-tool-exposure'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: verified-npm-package
          path: ${{ runner.temp }}/dsh-package
      - name: Check the release archive
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';

          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} must match v${version}`);
          }

          const archive = join(process.env.RUNNER_TEMP, 'dsh-package', `${name}-${version}.tgz`);
          const integrity = `sha512-${createHash('sha512').update(readFileSync(archive)).digest('base64')}`;
          const registryUrl = `https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`;
          const response = await fetch(registryUrl, { signal: AbortSignal.timeout(15_000) });
          if (response.ok) {
            const published = await response.json();
            if (published.dist?.integrity !== integrity) {
              throw new Error(`npm already has a different archive for ${name}@${version}`);
            }
            console.log(`${name}@${version} is already published with this archive`);
          } else if (response.status !== 404) {
            throw new Error(`npm registry lookup failed with HTTP ${response.status}`);
          }

          const prerelease = process.env.PRERELEASE === 'true' || version.includes('-');
          appendFileSync(process.env.GITHUB_OUTPUT, `archive=${archive}\npublish=${!response.ok}\nprerelease=${prerelease}\n`);
          NODE
      - name: Publish via npm Trusted Publishing
        if: steps.package.outputs.publish == 'true'
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          PRERELEASE: ${{ steps.package.outputs.prerelease }}
        run: |
          if [[ "$PRERELEASE" == true ]]; then
            npm publish "$ARCHIVE" --ignore-scripts --tag next
          else
            npm publish "$ARCHIVE" --ignore-scripts
          fi
