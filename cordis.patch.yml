# Extend the official ToolsService to record each tool's registering plugin.
# Restart DSH after upgrading so every tool registers with the tracking service.
- id: tools
  name: '@deepseek-ai/dsh-tools'
  disabled: true
- insert:
    - id: tool-exposure-registry
      name: 'dsh-tool-exposure/registry'
    - id: tool-exposure
      name: 'dsh-tool-exposure'
      config:
        discovery: true
        unlisted: open
        sources: {}
        roles: {}
